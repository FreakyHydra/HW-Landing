name: HW Landing CI

on:
  push:
    branches: [main, dev, rebrand-v2]
  pull_request:
    branches: [main, rebrand-v2]

concurrency:
  group: hw-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, syntax check and build
        run: npm run check
